[project]
name = "js2py-database-lab"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "fastapi==0.135.1",
  "uvicorn==0.42.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "starlette==0.52.1",
  "pytest==8.4.2",
]

[tool.uv]
package = false
constraint-dependencies = ["anyio==4.12.1"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests", "solutions"]
pythonpath = ["."]
addopts = "-ra"

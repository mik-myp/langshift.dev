[project]
name = "d03-transactions"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

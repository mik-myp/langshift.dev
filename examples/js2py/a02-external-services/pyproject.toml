[project]
name = "js2py-a02-external-services"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "anyio==4.12.1",
  "uvicorn==0.42.0",
  "pydantic==2.12.5",
  "starlette==0.52.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

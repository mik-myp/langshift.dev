[project]
name = "js2py-u11-typing"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==2.3.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["estimates.py", "app.py", "solutions/first_over.py"]
disallow_untyped_defs = true

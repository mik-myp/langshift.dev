[project]
name = "js2py-o02-containers"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0", "pydantic==2.12.5", "starlette==0.52.1", "anyio==4.12.1"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

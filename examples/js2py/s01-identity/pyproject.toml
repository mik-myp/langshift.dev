[project]
name = "js2py-s01-identity"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.42.0", "pydantic==2.12.5",
  "SQLAlchemy==2.0.54", "alembic==1.20.0", "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
